[neopixel front_bar]
pin:                     PD3
chain_count:             24

# led_effect sections disabled 2026-11-05. To restore, reinstall the plugin, then run in this folder:
#   sed -i -E "s/^(s*)#LED /1/" leds.cfg macros.cfg moonraker.conf
#LED [led_effect idle]
#LED autostart:              true
#LED frame_rate:             24
#LED leds:
#LED     neopixel:front_bar
#LED layers:
#LED     breathing 24.00 0.00 top (0.75,0.75,0.75) 


#LED [led_effect progress]
#LED autostart:              false
#LED frame_rate:             24
#LED leds:
#LED     neopixel:front_bar
#LED layers:
#LED     progress 24.00 0.00 top (0.65,0.65,0.65),(0.65,0.65,0.65),(0.65,0.65,0.65)

#LED [led_effect cancel]
#LED autostart:              false
#LED frame_rate:             24
#LED leds:
#LED     neopixel:front_bar
#LED layers:
#LED     breathing 5.00 0.00 top (1.00,0.00,0.00),(1.00,0.50,0.00) 

#LED [led_effect paused]
#LED autostart:              false
#LED frame_rate:             24
#LED leds:
#LED     neopixel:front_bar
#LED layers:
#LED     breathing 5.00 0.00 top (0.00,0.50,1.00)

#LED [led_effect finished]
#LED autostart:              false
#LED frame_rate:             24
#LED leds:
#LED     neopixel:front_bar
#LED layers:
#LED     comet 0.75 3.00 subtract_b (0.50,1.00,0.50),(0.00,1.00,0.25),(0.00,0.50,0.00)

#LED [led_effect bed_heating]
#LED autostart:              false
#LED frame_rate:             24
#LED heater: heater_bed
#LED leds:
#LED     neopixel:front_bar
#LED layers:
#LED     heatergauge 24.00 0.00 top (1.00,0.00,0.00),(0.78,0.00,0.00),(0.49,0.00,0.00) 

#LED [led_effect hotend_heating]
#LED autostart:              false
#LED frame_rate:             24
#LED heater: extruder
#LED leds:
#LED     neopixel:front_bar
#LED layers:
#LED     heatergauge 24.00 0.00 top (0.80,0.00,1.00),(0.45,0.00,0.54),(0.29,0.00,0.36) 

#LED [led_effect homing]
#LED autostart:              false
#LED frame_rate:             24
#LED endstops: x, y, z
#LED leds:
#LED     neopixel:front_bar
#LED layers:
#LED     homing 24.00 0.00 top (1.00,0.95,0.00) 

#LED [led_effect bed_mesh]
#LED autostart:              false
#LED frame_rate:             24
#LED stepper: x
#LED leds:
#LED     neopixel:front_bar
#LED layers:
#LED     stepper 1.00 1.00 top (0.00,1.00,0.00),(0.00,0.50,0.00) 



